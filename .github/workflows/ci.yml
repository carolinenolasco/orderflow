name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes-receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes do order-receiver-service
        working-directory: order-receiver-service
        run: mvn -B test
