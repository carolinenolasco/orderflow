spring.application.name=order-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos
spring.datasource.username=user
spring.datasource.password=pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.cloud.stream.bindings.order-in.destination=orders-exchange
spring.cloud.stream.bindings.order-in.group=order-service-group
spring.cloud.stream.bindings.order-out.destination=orders-processed-exchange

spring.cloud.stream.rabbit.bindings.order-in.consumer.autoBindDlq=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
