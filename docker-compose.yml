x-spring: &spring
  SPRING_DOCKER_COMPOSE_ENABLED: "false"
  SPRING_DATASOURCE_USERNAME: user
  SPRING_DATASOURCE_PASSWORD: pass

services:
  postgres:
    image: postgres:16
    container_name: postgres-orderflow
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  customer-service:
    build: ./customer-service
    ports: ["8081:8081"]
    environment:
      <<: *spring
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clientes
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    build: ./product-service
    ports: ["8082:8082"]
    environment:
      <<: *spring
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/produtos
    depends_on:
      postgres: { condition: service_healthy }

  stock-service:
    build: ./stock-service
    ports: ["8083:8083"]
    environment:
      <<: *spring
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/estoque
    depends_on:
      postgres: { condition: service_healthy }

  order-service:
    build: ./order-service
    ports: ["8084:8084"]
    environment:
      <<: *spring
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pedidos
    depends_on:
      postgres: { condition: service_healthy }

  payment-service:
    build: ./payment-service
    ports: ["8086:8086"]
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

  order-receiver-service:
    build: ./order-receiver-service
    ports: ["8085:8085"]
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVICES_CUSTOMER_URL: http://customer-service:8081
      SERVICES_PRODUCT_URL: http://product-service:8082
      SERVICES_STOCK_URL: http://stock-service:8083
      SERVICES_ORDER_URL: http://order-service:8084
      SERVICES_PAYMENT_URL: http://payment-service:8086
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      customer-service: { condition: service_started }
      product-service: { condition: service_started }
      stock-service: { condition: service_started }
      order-service: { condition: service_started }
      payment-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
  rabbitdata:
